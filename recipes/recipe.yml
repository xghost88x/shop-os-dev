---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json

name: shop-os-dev
description: Custom automotive shop workstation operating system.

base-image: ghcr.io/ublue-os/kinoite-main
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: dnf
    install:
      packages:
        - btop
        - smartmontools
        - nvme-cli
        - lm_sensors
        - ethtool
        - pciutils
        - usbutils
        - openssh-server
    remove:
      packages:
        - firefox
        - firefox-langpacks

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.kde.okular
          - org.kde.gwenview
          - com.rustdesk.RustDesk
      - scope: user

  - type: signing
